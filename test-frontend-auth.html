<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strinex Auth Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; }
        .success { border-left: 4px solid #4caf50; }
        .error { border-left: 4px solid #f44336; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #ff4b4b; color: white; border: none; border-radius: 4px; }
        button:hover { background: #ff3333; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Strinex Authentication Test</h1>
    
    <div>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <button onclick="testRunsNoAuth()">Test Runs (No Auth)</button>
        <button onclick="testRunsWithAuth()">Test Runs (With Auth)</button>
        <button onclick="checkClerkSession()">Check Clerk Session</button>
    </div>

    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" 
            data-clerk-publishable-key="pk_test_Y2l2aWwtY2FpbWFuLTIxLmNsZXJrLmFjY291bnRzLmRldiQ"
            crossorigin="anonymous"></script>

    <script>
        const BACKEND_URL = 'https://strinex-07.onrender.com';
        const resultsDiv = document.getElementById('results');

        function addResult(title, data, isSuccess) {
            const div = document.createElement('div');
            div.className = `test ${isSuccess ? 'success' : 'error'}`;
            div.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            resultsDiv.insertBefore(div, resultsDiv.firstChild);
        }

        async function getClerkToken() {
            try {
                await window.Clerk.load();
                const session = window.Clerk.session;
                if (session && typeof session.getToken === 'function') {
                    return await session.getToken();
                }
                return null;
            } catch (error) {
                console.error('Clerk error:', error);
                return null;
            }
        }

        async function testHealth() {
            try {
                const response = await fetch(`${BACKEND_URL}/health`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Origin': window.location.origin
                    }
                });
                
                const data = await response.json();
                addResult('✅ Health Check', {
                    status: response.status,
                    cors: response.headers.get('access-control-allow-origin'),
                    data
                }, response.ok);
            } catch (error) {
                addResult('❌ Health Check Failed', { error: error.message }, false);
            }
        }

        async function testRunsNoAuth() {
            try {
                const response = await fetch(`${BACKEND_URL}/runs`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                addResult('Runs Without Auth (Should Fail)', {
                    status: response.status,
                    expected: 401,
                    data
                }, response.status === 401);
            } catch (error) {
                addResult('❌ Runs Test Failed', { error: error.message }, false);
            }
        }

        async function testRunsWithAuth() {
            try {
                const token = await getClerkToken();
                
                if (!token) {
                    addResult('❌ No Clerk Token', { 
                        message: 'Please sign in first',
                        clerkLoaded: !!window.Clerk,
                        hasSession: !!window.Clerk?.session
                    }, false);
                    return;
                }

                const response = await fetch(`${BACKEND_URL}/runs`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                addResult('✅ Runs With Auth', {
                    status: response.status,
                    tokenPreview: token.substring(0, 20) + '...',
                    data
                }, response.ok);
            } catch (error) {
                addResult('❌ Runs With Auth Failed', { error: error.message }, false);
            }
        }

        async function checkClerkSession() {
            try {
                await window.Clerk.load();
                const session = window.Clerk.session;
                const user = window.Clerk.user;
                
                addResult('Clerk Session Info', {
                    clerkLoaded: !!window.Clerk,
                    hasSession: !!session,
                    hasUser: !!user,
                    userId: user?.id,
                    userEmail: user?.primaryEmailAddress?.emailAddress,
                    sessionId: session?.id,
                    canGetToken: session && typeof session.getToken === 'function'
                }, !!session);
            } catch (error) {
                addResult('❌ Clerk Check Failed', { error: error.message }, false);
            }
        }

        // Auto-load Clerk on page load
        window.addEventListener('load', () => {
            console.log('🚀 Test page loaded. Click buttons to test endpoints.');
        });
    </script>
</body>
</html>
